# Lint, unit tests and build on every push / PR; SQL suites on a throw-away Postgres; end-to-end tests on a local
# Supabase stack started inside the runner (no project keys needed, nothing touches production).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder

  sql:
    name: SQL test suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run_sql_tests.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase stack
        # migrations are applied below in the documented order (0005 last), so keep them out of `supabase start`
        run: |
          mv supabase/migrations /tmp/migrations
          [ -f supabase/config.toml ] || supabase init --force
          supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,studio,mailpit
          mv /tmp/migrations supabase/migrations
          supabase status -o env > /tmp/sb.env
          cat /tmp/sb.env | grep -E '^(API_URL|DB_URL)='
      - name: Apply migrations (0001-0004, 0006-0016, then 0005)
        run: |
          source /tmp/sb.env
          for m in 0001_baseline 0002_roles_rls 0003_audit_lock 0004_posting 0006_credit_receipts 0007_commissions 0008_reporting \
                   0009_vat 0010_zatca_phase2 0011_inventory 0012_procurement 0013_sales_controls 0014_projects_contracts 0015_notifications 0016_billing_completion 0005_lock_writes; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/$m.sql
          done
      - name: Seed test users
        run: |
          source /tmp/sb.env
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node e2e/seed.mjs
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: |
          source /tmp/sb.env
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
